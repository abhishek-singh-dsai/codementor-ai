name: Import reviewed CodeMentor AI project
on:
  push:
    paths:
      - ".project-import.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .project-import.b64 > /tmp/project-import.tar.xz
          echo "391aca5068140d35f22ee8a361be21731eaacc74eecd1d38660c6aad3603900b  /tmp/project-import.tar.xz" | sha256sum -c -
          tar -xJf /tmp/project-import.tar.xz --strip-components=1
          test -f README.md
          test -f app.py
          test -f main.py
          test -f ai_engine.py
          test -f tests/test_api.py
          rm -f .project-import.b64 .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add CodeMentor AI application, tests, and documentation"
          git push
