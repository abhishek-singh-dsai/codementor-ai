name: Import project source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified project archive (when present)
        shell: bash
        run: |
          if [ ! -f .codementor_payload.txt ]; then
            echo "No payload yet."
            exit 0
          fi
          base64 -d .codementor_payload.txt | tar -xJf -
          rm .codementor_payload.txt
          rm .github/workflows/import-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish CodeMentor AI application, documentation and tests"
          git push
